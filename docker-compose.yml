services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aes
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aes -d aes"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://aes:${POSTGRES_PASSWORD}@db:5432/aes
      CHROMA_DIR: /data/chroma
    volumes:
      - chroma:/data/chroma
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8010:8000" # API docs at http://localhost:8010/docs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80" # the app: http://localhost:8080
    restart: unless-stopped

volumes:
  pgdata:
  chroma:
